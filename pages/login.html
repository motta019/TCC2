<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <div class="container">

    <!-- LADO ESQUERDO -->
    <section class="left">

      <div class="login-content">

        <h1>BEM-VINDO</h1>

        <form>

          <!-- Usuário -->
          <div class="input-group">
            <input
              type="text"
              placeholder="Usuário"
              required
            >
          </div>

          <!-- Senha -->
          <div class="input-group">
            <input
              type="password"
              placeholder="Senha"
              required
            >
          </div>

          <!-- Lembrar e esqueci a senha -->
          <div class="options">

            <label class="remember">
              <input type="checkbox">
              <span>Lembrar-me</span>
            </label>

            <a href="#" class="forgot-password">
              Esqueci minha senha
            </a>

          </div>

          <!-- Entrar -->
          <button type="submit">
            ENTRAR
          </button>

          <!-- Cadastrar -->
          <a href="cadastro.html" class="register">
            CADASTRAR
          </a>

        </form>

      </div>

    </section>


    <!-- LADO DIREITO -->
    <section class="right">

      <div class="image-container">
        <img src="../img/geral/andermaq.png" alt="Logo principal">
      </div>

    </section>

  </div>

</body>

</html>
