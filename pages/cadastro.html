<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

    <div class="container">

        <!-- FUNDO AZUL + LOGO -->
        <section class="center">

            <!-- LOGO -->
            <div class="image-container">
                <img src="../img/geral/andermaq.png" alt="Logo principal">
            </div>

        </section>


        <!-- FORMULÁRIO -->
        <section class="left">

            <div class="login-content">

                <h1>Cadastrar</h1>

                <form>

                    <!-- EMAIL -->
                    <div class="input-group">

                        <input
                            type="email"
                            placeholder="Email"
                            required
                        >

                    </div>


                    <!-- SENHA -->
                    <div class="input-group">

                        <input
                            type="password"
                            placeholder="Senha"
                            required
                        >

                    </div>


                    <!-- REPETIR SENHA -->
                    <div class="input-group">

                        <input
                            type="password"
                            placeholder="Repetir Senha"
                            required
                        >

                    </div>


                    <!-- ENTRAR -->
                    <button type="submit">
                        ENTRAR
                    </button>


                    <!-- VOLTAR -->
                    <a href="login.html" class="register">
                        VOLTAR
                    </a>

                </form>

            </div>

        </section>

    </div>

</body>

</html>
